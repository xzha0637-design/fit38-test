name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Python regression suite
        run: python -m pytest --basetemp .pytest-tmp

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          for file in frontend/*.js; do
            node --check "$file"
          done

      - name: Verify the release run sheet
        run: python -m scripts.verify_run_sheet

      - name: Check installed dependency consistency
        run: python -m pip check
