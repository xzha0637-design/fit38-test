limit_req_zone $binary_remote_addr zone=general_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=scoring_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=batch_per_ip:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=workflow_per_ip:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

upstream signal_review {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.218.145.76;
    server_tokens off;
    access_log off;

    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn connections_per_ip 20;
    limit_req_status 429;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://fastapi.tiangolo.com; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    error_page 429 = @rate_limited;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location = /api/v1/assessments {
        limit_req zone=scoring_per_ip burst=3 nodelay;
        proxy_pass http://signal_review;
    }

    location = /api/v1/batch-assessments {
        limit_req zone=batch_per_ip burst=1 nodelay;
        proxy_pass http://signal_review;
    }

    location = /api/v1/feedback {
        default_type application/json;
        return 403 '{"error":{"code":"feedback_access_disabled","message":"Feedback export is not available on the public demo.","retryable":false}}';
    }

    location ~ ^/api/v1/assessments/[A-Za-z0-9_]+/(decision|override|follow-up)$ {
        limit_req zone=workflow_per_ip burst=5 nodelay;
        proxy_pass http://signal_review;
    }

    location / {
        limit_req zone=general_per_ip burst=30 nodelay;
        proxy_pass http://signal_review;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Retry later.","retryable":true}}';
    }
}
